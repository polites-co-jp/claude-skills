name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check the hook and installer scripts
        run: |
          set -e
          for f in project-design-harness/assets/hooks/*.mjs project-design-harness/assets/hooks/lib/*.mjs project-design-harness/scripts/*.mjs md-to-slidev/tests/*.mjs slide-design-review/scripts/*.mjs slide-design-review/tests/*.mjs; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Repository checks (JSON, links, placeholders, level codes)
        run: node tests/check-repo.mjs

      - name: Hook scenarios (write-boundary, completion-gate)
        run: node project-design-harness/tests/hook-scenarios.mjs

      - name: Installer scenarios (harness-install.mjs)
        run: node project-design-harness/tests/installer.mjs

      - name: md-to-slidev parts (static checks + slidev build of the example)
        run: node md-to-slidev/tests/build-example.mjs

      - name: slide-design-review scripts (PNG diff, snapshot, and a real render of the md-to-slidev example)
        run: |
          npx -y playwright install-deps chromium
          node slide-design-review/tests/scripts.mjs

      - name: Skill discovery (npx skills)
        run: npx -y skills add . --list
